services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sympl
      POSTGRES_PASSWORD: sympl_dev_pass
      POSTGRES_DB: sympl_pa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sympl -d sympl_pa"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://sympl:sympl_dev_pass@db:5432/sympl_pa"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-change-me-to-a-random-secret}"
      NEXTAUTH_URL: "http://localhost:3000"
    depends_on:
      db:
        condition: service_healthy

  # Dev-only service — run with: docker compose --profile dev up
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    profiles: [dev]
    command: sh -c "npx prisma db push && npm run db:seed && npm run dev"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://sympl:sympl_dev_pass@db:5432/sympl_pa"
      NEXTAUTH_SECRET: "dev-secret-change-me"
      NEXTAUTH_URL: "http://localhost:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
